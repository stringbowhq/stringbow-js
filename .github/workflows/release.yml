name: Release

# Publishes both packages to npm when a version tag (v0.1.0) is pushed.
# Needs the repository secret NPM_TOKEN: an npm automation token allowed to publish to the @stringbow scope.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: The tag matches the package versions
        run: |
          node -e "
          const want = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const p of ['browser', 'node']) {
            const v = require('./packages/' + p + '/package.json').version;
            if (v !== want) { console.error('@stringbow/' + p + ' is ' + v + ', the tag says ' + want); process.exit(1); }
          }"
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --workspace @stringbow/browser --workspace @stringbow/node --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
