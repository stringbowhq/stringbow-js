name: Release

# Publishes both packages to npm when a version tag (v0.2.0) is pushed.
# No npm token is stored anywhere: npm trusts this workflow in this repository (Trusted Publishing, set on each
# package's settings page on npmjs.com) and exchanges the run's short-lived GitHub identity for publish rights.
# Renaming this file or the repository breaks that trust until the package settings are updated.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the identity npm checks, and provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm new enough for Trusted Publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci --no-audit --no-fund
      - name: The tag matches the package versions
        run: |
          node -e "
          const want = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const p of ['browser', 'node']) {
            const v = require('./packages/' + p + '/package.json').version;
            if (v !== want) { console.error('@stringbow/' + p + ' is ' + v + ', the tag says ' + want); process.exit(1); }
          }"
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --workspace @stringbow/browser --workspace @stringbow/node --provenance --access public
